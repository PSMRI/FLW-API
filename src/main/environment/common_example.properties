server.port=8081
# FHIR Config
fhir-url=http://localhost:8093/

 # TM Config
tm-url=http://localhost:8089/
##--------------------------------------------## Primary db-------------------------------------------------------------------

spring.datasource.url=jdbc:mysql://localhost:3306/db_iemr
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.jdbc.Driver

##--------------------------------------------## Secondary db-------------------------------------------------------------------

secondary.datasource.url=jdbc:mysql://localhost:3306/db_identity
secondary.datasource.username=root
secondary.datasource.password=1234
secondary.datasource.driver-class-name=com.mysql.jdbc.Driver

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

logging.path=logs/
logging.file.name=logs/flw-api.log

jwt.secret=my-32-character-ultra-secure-and-ultra-long-secret

# Redis Config
spring.redis.host=localhost

cors.allowed-origins=http://localhost:*

source-address=
sms-username=
sms-password=
send-message-url=

crash.logs.base.path=<path used>

# ABHA Token Config
abha.client.id=<your-abha-client-id>
abha.client.secret=<your-abha-client-secret>
abha.token.url=<abha-token-url>
abha.xcmid=<sbx-or-prod>





# Diagnostic providers

# Provider names: use the values supported by your application
diagnostic.provider.xray=<XRAY_PROVIDER>
diagnostic.provider.truenat=<TRUENAT_PROVIDER>

# EMR Lite - Xray (base URL without trailing slash)
diagnostic.emrlite.xray.base-url=https://<EMRLITE_HOST>
diagnostic.emrlite.xray.login-url=${diagnostic.emrlite.xray.base-url}/api/v1/integrations/login/
diagnostic.emrlite.xray.refresh-url=${diagnostic.emrlite.xray.base-url}/api/v1/integrations/getAccessToken/
diagnostic.emrlite.xray.order-url=${diagnostic.emrlite.xray.base-url}/api/v1/integrations/orders/
diagnostic.emrlite.xray.result-url=${diagnostic.emrlite.xray.base-url}/api/v1/integrations/orders/result/
diagnostic.emrlite.xray.ping-url=${diagnostic.emrlite.xray.base-url}/api/v1/integrations/ping/
diagnostic.emrlite.xray.username=<XRAY_USERNAME>
diagnostic.emrlite.xray.password=<XRAY_PASSWORD>

# EMR Lite - Truenat
diagnostic.emrlite.truenat.base-url=https://<EMRLITE_HOST>
diagnostic.emrlite.truenat.login-url=${diagnostic.emrlite.truenat.base-url}/api/v1/integrations/login/
diagnostic.emrlite.truenat.refresh-url=${diagnostic.emrlite.truenat.base-url}/api/v1/integrations/getAccessToken/
diagnostic.emrlite.truenat.order-url=${diagnostic.emrlite.truenat.base-url}/api/v1/integrations/orders/
diagnostic.emrlite.truenat.result-url=${diagnostic.emrlite.truenat.base-url}/api/v1/integrations/orders/result/
diagnostic.emrlite.truenat.ping-url=${diagnostic.emrlite.truenat.base-url}/api/v1/integrations/ping/
diagnostic.emrlite.truenat.username=<TRUENAT_USERNAME>
diagnostic.emrlite.truenat.password=<TRUENAT_PASSWORD>

# Token TTL: replace with vendor-configured durations in seconds
diagnostic.emrlite.refresh-ttl-seconds=86400

# Example: polling every 60 seconds
diagnostic.poll.xray.tick-ms=60000
diagnostic.poll.truenat.tick-ms=60000

# Example: daily expiry at 11:59 PM in scheduler timezone
diagnostic.poll.expiry-cron=0 59 23 * * *

# Local folder (Windows: use forward slashes)
diagnostic.documents.storage-root=C:/amrit/diagnostic-documents
stoptb.enforce.vanid=false
# Stop TB: this deployment's van/camp ID, replacing the old Redis camp:vanID lookup
stoptb.van.id=0



# GovThealth API Config
govthealth.user.details.url=@env.GOVTHEALTH_USER_DETAILS_URL@
govthealth.user.id=@env.GOVTHEALTH_USER_ID@
govthealth.password=@env.GOVTHEALTH_PASSWORD@
common-api-base-url=
