fhir-url = ${FHIR_API}
tm-url = ${TM_API}

##--------------------------------------------## Primary db-------------------------------------------------------------------

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.jdbc.Driver

##--------------------------------------------## Secondary db-------------------------------------------------------------------

secondary.datasource.username=${DATABASE_IDENTITY_USERNAME}
secondary.datasource.password=${DATABASE_IDENTITY_PASSWORD}
secondary.datasource.url=${DATABASE_IDENTITY_URL}
secondary.datasource.driver-class-name=com.mysql.jdbc.Driver




#ELK logging file name
logging.path=logs/
logging.file.name=${FLW_API_LOGGING_FILE_NAME}

jwt.secret=${JWT_SECRET_KEY}

# Redis Config
spring.redis.host=${REDIS_HOST}

# Stop TB: when true, saves fail with an error if camp (vanID) is not configured
stoptb.enforce.vanid=${STOPTB_ENFORCE_VANID}

#### SMS Configuration
send-sms=${SEND_SMS}
source-address=${SMS_CONSENT_SOURCE_ADDRESS}
sms-username=${SMS_USERNAME}
sms-password=${SMS_PASSWORD}

send-message-url=${SMS_MESSAGE_URL}

#crash.logs.base.path=${CRASH_LOGS_PATH}

# ── Diagnostic Device Integration ────────────────────────────────────────────
# diagnostic.provider.xray / diagnostic.provider.truenat select the vendor per orderType family
# (XRAY_CHEST vs MTB/MTB_PLUS/MDR_RIF), each must be one of com.iemr.flw.masterEnum.DiagnosticProviderCode
diagnostic.provider.xray=${DIAGNOSTIC_PROVIDER_XRAY}
diagnostic.provider.truenat=${DIAGNOSTIC_PROVIDER_TRUENAT}

# EMR Lite - xray group (same base-url as truenat for now; split so a distinct vendor/tenant can be
# swapped in for either group later without a code change)
diagnostic.emrlite.xray.base-url=${DIAGNOSTIC_EMRLITE_XRAY_BASE_URL}
diagnostic.emrlite.xray.login-url=${diagnostic.emrlite.xray.base-url}/api/v1/integrations/login/
diagnostic.emrlite.xray.refresh-url=${diagnostic.emrlite.xray.base-url}/api/v1/integrations/getAccessToken/
diagnostic.emrlite.xray.order-url=${diagnostic.emrlite.xray.base-url}/api/v1/integrations/orders/
diagnostic.emrlite.xray.result-url=${diagnostic.emrlite.xray.base-url}/api/v1/integrations/orders/result/
diagnostic.emrlite.xray.ping-url=${diagnostic.emrlite.xray.base-url}/api/v1/integrations/ping/
diagnostic.emrlite.xray.username=${DIAGNOSTIC_EMRLITE_XRAY_USERNAME}
diagnostic.emrlite.xray.password=${DIAGNOSTIC_EMRLITE_XRAY_PASSWORD}

# EMR Lite - truenat group (MTB/MTB_PLUS/MDR_RIF); same value as xray for now
diagnostic.emrlite.truenat.base-url=${DIAGNOSTIC_EMRLITE_TRUENAT_BASE_URL}
diagnostic.emrlite.truenat.login-url=${diagnostic.emrlite.truenat.base-url}/api/v1/integrations/login/
diagnostic.emrlite.truenat.refresh-url=${diagnostic.emrlite.truenat.base-url}/api/v1/integrations/getAccessToken/
diagnostic.emrlite.truenat.order-url=${diagnostic.emrlite.truenat.base-url}/api/v1/integrations/orders/
diagnostic.emrlite.truenat.result-url=${diagnostic.emrlite.truenat.base-url}/api/v1/integrations/orders/result/
diagnostic.emrlite.truenat.ping-url=${diagnostic.emrlite.truenat.base-url}/api/v1/integrations/ping/
diagnostic.emrlite.truenat.username=${DIAGNOSTIC_EMRLITE_TRUENAT_USERNAME}
diagnostic.emrlite.truenat.password=${DIAGNOSTIC_EMRLITE_TRUENAT_PASSWORD}

diagnostic.emrlite.token-ttl-seconds=${DIAGNOSTIC_EMRLITE_TOKEN_TTL_SECONDS}
diagnostic.emrlite.refresh-ttl-seconds=${DIAGNOSTIC_EMRLITE_REFRESH_TTL_SECONDS}

diagnostic.poll.xray.tick-ms=${DIAGNOSTIC_POLL_XRAY_TICK_MS}
diagnostic.poll.xray.initial-delay-minutes=${DIAGNOSTIC_POLL_XRAY_INITIAL_DELAY_MINUTES}
diagnostic.poll.give-up-minutes=${DIAGNOSTIC_POLL_GIVE_UP_MINUTES}
diagnostic.poll.retry.window-minutes=${DIAGNOSTIC_POLL_RETRY_WINDOW_MINUTES}
diagnostic.poll.interval-seconds=${DIAGNOSTIC_POLL_INTERVAL_SECONDS}
diagnostic.poll.truenat.initial-delay-minutes=${DIAGNOSTIC_POLL_TRUENAT_INITIAL_DELAY_MINUTES}
diagnostic.poll.truenat.tick-ms=${DIAGNOSTIC_POLL_TRUENAT_TICK_MS}

diagnostic.documents.storage-root=${DIAGNOSTIC_DOCUMENTS_STORAGE_ROOT}


