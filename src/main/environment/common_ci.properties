
fhir-url = @env.FHIR_API@
tm-url = @env.TM_API@

##--------------------------------------------## Primary db-------------------------------------------------------------------

spring.datasource.url=@env.DATABASE_URL@
spring.datasource.username=@env.DATABASE_USERNAME@
spring.datasource.password=@env.DATABASE_PASSWORD@
spring.datasource.driver-class-name=com.mysql.jdbc.Driver

##--------------------------------------------## Secondary db-------------------------------------------------------------------

secondary.datasource.username=@env.DATABASE_IDENTITY_USERNAME@
secondary.datasource.password=@env.DATABASE_IDENTITY_PASSWORD@
secondary.datasource.url=@env.DATABASE_IDENTITY_URL@
secondary.datasource.driver-class-name=com.mysql.jdbc.Driver



#ELK logging file name
logging.path=logs/
logging.file.name=@env.FLW_API_LOGGING_FILE_NAME@

jwt.secret=@env.JWT_SECRET_KEY@

# Redis Config
spring.redis.host=@env.REDIS_HOST@

# Stop TB: when true, saves fail with an error if camp (vanID) is not configured
stoptb.enforce.vanid=@env.STOPTB_ENFORCE_VANID@

cors.allowed-origins=@env.CORS_ALLOWED_ORIGINS@

#### SMS Configuration
send-sms=@env.SEND_SMS@
source-address=@env.SMS_CONSENT_SOURCE_ADDRESS@
sms-username=@env.SMS_USERNAME@
sms-password=@env.SMS_PASSWORD@
send-message-url=@env.SMS_MESSAGE_URL@

#crash.logs.base.path=@env.CRASH_LOGS_PATH@

# ── Diagnostic Device Integration ────────────────────────────────────────────
# diagnostic.provider.xray / diagnostic.provider.truenat select the vendor per orderType family
# (XRAY_CHEST vs MTB/MTB_PLUS/MDR_RIF), each must be one of com.iemr.flw.masterEnum.DiagnosticProviderCode
diagnostic.provider.xray=@env.DIAGNOSTIC_PROVIDER_XRAY@
diagnostic.provider.truenat=@env.DIAGNOSTIC_PROVIDER_TRUENAT@

# EMR Lite - xray group (same base-url as truenat for now; split so a distinct vendor/tenant can be
# swapped in for either group later without a code change)
diagnostic.emrlite.xray.base-url=@env.DIAGNOSTIC_EMRLITE_XRAY_BASE_URL@
diagnostic.emrlite.xray.login-url=${diagnostic.emrlite.xray.base-url}/api/v1/integrations/login/
diagnostic.emrlite.xray.refresh-url=${diagnostic.emrlite.xray.base-url}/api/v1/integrations/getAccessToken/
diagnostic.emrlite.xray.order-url=${diagnostic.emrlite.xray.base-url}/api/v1/integrations/orders/
diagnostic.emrlite.xray.result-url=${diagnostic.emrlite.xray.base-url}/api/v1/integrations/orders/result/
diagnostic.emrlite.xray.ping-url=${diagnostic.emrlite.xray.base-url}/api/v1/integrations/ping/
diagnostic.emrlite.xray.username=@env.DIAGNOSTIC_EMRLITE_XRAY_USERNAME@
diagnostic.emrlite.xray.password=@env.DIAGNOSTIC_EMRLITE_XRAY_PASSWORD@

# EMR Lite - truenat group (MTB/MTB_PLUS/MDR_RIF); same value as xray for now
diagnostic.emrlite.truenat.base-url=@env.DIAGNOSTIC_EMRLITE_TRUENAT_BASE_URL@
diagnostic.emrlite.truenat.login-url=${diagnostic.emrlite.truenat.base-url}/api/v1/integrations/login/
diagnostic.emrlite.truenat.refresh-url=${diagnostic.emrlite.truenat.base-url}/api/v1/integrations/getAccessToken/
diagnostic.emrlite.truenat.order-url=${diagnostic.emrlite.truenat.base-url}/api/v1/integrations/orders/
diagnostic.emrlite.truenat.result-url=${diagnostic.emrlite.truenat.base-url}/api/v1/integrations/orders/result/
diagnostic.emrlite.truenat.ping-url=${diagnostic.emrlite.truenat.base-url}/api/v1/integrations/ping/
diagnostic.emrlite.truenat.username=@env.DIAGNOSTIC_EMRLITE_TRUENAT_USERNAME@
diagnostic.emrlite.truenat.password=@env.DIAGNOSTIC_EMRLITE_TRUENAT_PASSWORD@

diagnostic.emrlite.token-ttl-seconds=@env.DIAGNOSTIC_EMRLITE_TOKEN_TTL_SECONDS@
diagnostic.emrlite.refresh-ttl-seconds=@env.DIAGNOSTIC_EMRLITE_REFRESH_TTL_SECONDS@

diagnostic.poll.xray.tick-ms=@env.DIAGNOSTIC_POLL_XRAY_TICK_MS@
diagnostic.poll.truenat.tick-ms=@env.DIAGNOSTIC_POLL_TRUENAT_TICK_MS@
# Daily cutoff (cron expression) after which all outstanding PENDING/IN_PROGRESS orders are marked EXPIRED
diagnostic.poll.expiry-cron=@env.DIAGNOSTIC_POLL_EXPIRY_CRON@

diagnostic.documents.storage-root=@env.DIAGNOSTIC_DOCUMENTS_STORAGE_ROOT@
